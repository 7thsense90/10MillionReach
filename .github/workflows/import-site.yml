name: Import website ZIP

on:
  push:
    paths:
      - "10millionreach-website.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract website
        shell: bash
        run: |
          if [ ! -f "10millionreach-website.zip" ]; then
            echo "ZIP already removed; nothing to import."
            exit 0
          fi
          unzip -o "10millionreach-website.zip" -d .
          rm "10millionreach-website.zip"

      - name: Commit extracted website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import 10 Million Reach website"
          git push
